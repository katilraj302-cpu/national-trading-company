<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t">
  <title id="t">Illustration of hardware tools and fittings</title>
  <rect width="640" height="360" rx="20" fill="#F1F5F9"/>
  <circle cx="545" cy="60" r="90" fill="#FDE68A" opacity=".45"/>
  <circle cx="80" cy="320" r="110" fill="#E2E8F0" opacity=".7"/>
  <!-- hammer -->
  <g transform="rotate(-28 200 180)">
    <rect x="178" y="120" width="26" height="150" rx="13" fill="#B45309"/>
    <rect x="150" y="92" width="82" height="40" rx="10" fill="#475569"/>
    <rect x="150" y="92" width="22" height="40" rx="8" fill="#64748B"/>
  </g>
  <!-- screwdriver -->
  <g transform="rotate(18 400 180)">
    <rect x="386" y="96" width="28" height="74" rx="12" fill="#F59E0B"/>
    <rect x="392" y="165" width="16" height="88" rx="6" fill="#94A3B8"/>
    <path d="M392 253h16l-8 26z" fill="#CBD5E1"/>
  </g>
  <!-- tape measure -->
  <g transform="rotate(-10 505 250)">
    <rect x="455" y="205" width="100" height="82" rx="20" fill="#F59E0B"/>
    <rect x="469" y="219" width="72" height="52" rx="12" fill="#FFF7E6"/>
    <circle cx="511" cy="246" r="13" fill="#0F172A" opacity=".85"/>
    <circle cx="511" cy="246" r="5" fill="#F8FAFC"/>
  </g>
  <!-- screws -->
  <g fill="#94A3B8">
    <path d="M110 265h12l-4 46h-4z"/>
    <path d="M132 258h12l-4 53h-4z"/>
    <path d="M154 268h12l-4 43h-4z"/>
  </g>
  <!-- hinge -->
  <g transform="translate(250 250)">
    <rect x="0" y="0" width="76" height="60" rx="8" fill="#64748B"/>
    <rect x="38" y="0" width="38" height="60" rx="8" fill="#475569"/>
    <circle cx="38" cy="30" r="9" fill="#CBD5E1"/>
    <circle cx="14" cy="14" r="4" fill="#CBD5E1"/>
    <circle cx="14" cy="46" r="4" fill="#CBD5E1"/>
  </g>
  <!-- spanner -->
  <g transform="rotate(38 90 100)" fill="#94A3B8">
    <rect x="76" y="60" width="16" height="110" rx="8"/>
    <path d="M68 48a24 24 0 1 1 32 0l-8 12H76z"/>
  </g>
</svg>
